<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieStar - Cadastre-se</title>
    <style>
        
        /* 1. Reset Básico e Fundo Escuro */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a; 
            color: #ffffff; 
        }
        
        /* 2. Centralização do Container */
        .log_in {
            display: flex;
            justify-content: center; 
            align-items: center; 
            height: 100%;
        }
        
        /* 3. Estilização do Formulário/Card de Cadastro */
        .texts_log_in {
            background-color: #2c2c2c; 
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); 
            width: 350px; 
            min-height: auto;
            text-align: center;
        }
        
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #ff9900; 
        }
        
        /* 4. Estilização dos Campos de Input */
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444; 
            border-radius: 4px;
            background-color: #383838; /* Fundo do input mais escuro */
            color: #ffffff;
            box-sizing: border-box;
            font-size: 16px;
        }

        input::placeholder {
            color: #ccc;
        }

        /* 5. Estilização do Botão de Envio (Cadastrar) */
        #btnEnviar {
            background-color: #ff9900; 
            color: #ffffff;
            font-size: 18px;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s, box-shadow 0.3s;
            
            width: 100%; 
        }

        #btnEnviar:hover {
            background-color: #ffb84d; 
            box-shadow: 0 5px 15px rgba(255, 153, 0, 0.4);
        }

        a, form article {
            display: none; 
        }
    </style>
</head>

<body class="log_in">
    <form action="/cadastro" method="POST" class="texts_log_in" id="formRegistro">
        <h1>Cadastre-se</h1>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

        <input type="password" id="senha1" name="senha1" placeholder="Digite sua senha" required>

        <input type="password" id="senha2" name="senha2" placeholder="Repita sua senha" required>
        
        <button type="button" id="btnEnviar">Criar Conta</button>
    </form>
    
    <script>
        const form = document.getElementById('formRegistro');
        const btnEnviar = document.getElementById('btnEnviar');
        const senha1 = document.getElementById('senha1');
        const senha2 = document.getElementById('senha2');

        btnEnviar.addEventListener('click', function(event) {
            event.preventDefault(); 

            // Validação simples
            if (!form.checkValidity()) {
                alert("Por favor, preencha todos os campos corretamente.");
                return;
            }

            if (senha1.value !== senha2.value) {
                alert("As senhas não coincidem.");
                return;
            }

            form.submit();

        });

    </script>
</body>
</html>
